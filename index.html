<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>idkbot</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <h1>idkbot</h1>
      <span class="hint">try <code>;credits</code> or <code>;time</code></span>
    </header>

    <section id="log" class="log" role="log" aria-live="polite"></section>

    <form id="composer" class="composer" autocomplete="off">
      <input id="input" type="text" placeholder="type a message… (;credits, ;time)" />
      <button id="send" type="submit">Send</button>
    </form>
  </main>

  <script src="main.js" defer></script>
</body>
</html>
